apiVersion: v1
kind: ConfigMap
metadata:
  name: modeledge-config
data:
  # Merged FP16 weights inside the pod (python -m quantization.merge output).
  # vLLM cannot serve the bare LoRA adapter directory.
  model_path: "/models/finetuned_merged"

  # FastAPI uses this to reach the vLLM service (ClusterIP DNS name)
  vllm_base_url: "http://modeledge-vllm:8001/v1"

  # vLLM generation defaults
  max_new_tokens: "256"
  temperature: "0.1"

  # Serving metadata
  model_name: "modeledge-medqa"
  max_seq_length: "2048"
