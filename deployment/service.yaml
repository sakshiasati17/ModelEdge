apiVersion: v1
kind: Service
metadata:
  name: modeledge-api
  labels:
    app: modeledge
    component: api
spec:
  type: LoadBalancer       # NodePort for Minikube — see note below
  selector:
    app: modeledge
    component: api
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8000
---
# Internal service — FastAPI talks to vLLM through this, not directly by pod IP
apiVersion: v1
kind: Service
metadata:
  name: modeledge-vllm
  labels:
    app: modeledge
    component: vllm
spec:
  type: ClusterIP
  selector:
    app: modeledge
    component: vllm
  ports:
    - name: http
      protocol: TCP
      port: 8001
      targetPort: 8001
---
# PersistentVolumeClaim — stores model weights so pods don't re-download on restart
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: modeledge-model-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
