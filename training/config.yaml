# QLoRA fine-tuning configuration

model:
  name: "unsloth/Llama-3.2-3B-Instruct"   # or "unsloth/Phi-3.5-mini-instruct"
  max_seq_length: 1024
  dtype: "float16"
  load_in_4bit: true

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.0
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  bias: "none"
  task_type: "CAUSAL_LM"

training:
  output_dir: "/kaggle/working/outputs/finetuned"
  num_train_epochs: 3
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.03
  lr_scheduler_type: "cosine"
  optim: "adamw_8bit"
  fp16: true
  bf16: false
  logging_steps: 10
  eval_steps: 100
  save_steps: 200
  save_total_limit: 3
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  report_to: "wandb"
  seed: 42

data:
  train_file: "data/processed/medqa/train.jsonl"
  val_file: "data/processed/medqa/val.jsonl"
  text_column: "text"

wandb:
  project: "modeledge-medqa"
  run_name: "qlora-llama3.2-3b"
